[project]
name = "ai-lawyer-india"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "openai>=1.40",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "structlog>=24.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=8.5",
    "rapidfuzz>=3.9",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "openai: requires OPENAI_API_KEY",
    "live: requires network",
    "slow: takes more than 2s",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
strict = false
ignore_missing_imports = true
